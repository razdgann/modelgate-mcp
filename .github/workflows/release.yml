# Publishes modelgate-mcp to npm with provenance when a version tag is pushed.
# Provenance requires this GitHub repository to be public.
#
# Auth (see docs/DEVELOPMENT.md#publishing):
#   - First release: the package does not exist on npm yet, so trusted
#     publishing cannot be configured. Add a short-lived granular npm token as
#     the NPM_TOKEN repository secret.
#   - After that: npmjs.com → modelgate-mcp → Settings → Trusted publisher →
#     GitHub Actions (razdgann / modelgate-mcp / release.yml / environment npm),
#     then delete the NPM_TOKEN secret. The job authenticates via OIDC.
#
# Release: bump package.json + src/version.ts, update CHANGELOG.md,
# commit, `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: npm ci --no-audit --no-fund

      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Verify
        run: npm run verify

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
